name: Build RouterLive IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project RouterLive.xcodeproj \
            -scheme RouterLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/RouterLive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/RouterLive.xcarchive/Products/Applications/RouterLive.app" Payload/
          zip -qry RouterLive-unsigned.ipa Payload
          ls -lh RouterLive-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterLive-unsigned-IPA
          path: RouterLive-unsigned.ipa
          retention-days: 30
